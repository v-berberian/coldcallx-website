  <style>
    /* CRM X in dark mode: the app's own ground, lights, cards and type (Theme.swift,
       Surface.swift in the CRM X repo). Nothing here moves: the app's field is still too. */
    :root {
      --ground: #110E0C;
      --card: rgba(29, 25, 22, 0.72);
      --ink: #F6F2EE;
      --muted: #B9AFA6;
      --hairline: rgba(255, 255, 255, 0.1);
      --accent: #FF8A3D;
      --pink: #F0506E;
      --orange: #F7941D;
      color-scheme: dark;
    }

    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--ground);
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
    }

    /* The warm field: a pink light top right, an orange one at the left edge, a low pink one,
       over a faint diagonal wash of the mark's colours. */
    .warm-field {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 92% 2%, rgba(240, 80, 110, 0.32), transparent 55%),
        radial-gradient(circle at 2% 42%, rgba(247, 148, 29, 0.22), transparent 50%),
        radial-gradient(circle at 70% 100%, rgba(240, 80, 110, 0.15), transparent 50%),
        linear-gradient(to bottom left, rgba(240, 80, 110, 0.09), rgba(247, 148, 29, 0.07), rgba(240, 80, 110, 0.06));
    }

    .page-title, .section-card h2, .back-link { font-family: 'Poppins', -apple-system, system-ui, sans-serif; }

    .page-title {
      font-size: clamp(2rem, 7vw, 3.75rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 1rem;
      background: linear-gradient(90deg, var(--pink), var(--orange));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .page-updated { color: var(--muted); font-size: 1.0625rem; margin: 0; }

    /* The app's glass controls: dark glass, a hairline rim. */
    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 1.25rem;
      margin-bottom: 2.5rem;
      border-radius: 999px;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--hairline);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    }
    .back-link:hover { background: rgba(255, 255, 255, 0.1); }

    /* The app's card: dark, slightly see-through, 24pt corners, a hairline, a soft shadow. */
    .section-card, .note-card {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      margin-bottom: 1rem;
    }
    .section-card h2 { font-weight: 600; font-size: 1.375rem; letter-spacing: -0.01em; }
    .section-card p + p, .section-card p + ul, .section-card ul + p { margin-top: 1rem; }
    .note-card { padding: 1.5rem; text-align: center; color: var(--muted); line-height: 1.6; }

    /* The page's own layout and the cards' insides, so nothing here depends on which
       utility classes the site's stylesheet happens to carry. */
    .page { min-height: 100vh; padding: 3rem 1rem; box-sizing: border-box; }
    .page-inner { max-width: 48rem; margin: 0 auto; }
    .page-head { text-align: center; margin-bottom: 2.5rem; }
    .section-card { padding: 1.5rem; }
    @media (min-width: 1024px) { .section-card { padding: 2.5rem; } }
    .section-card h2 { margin: 0 0 1.25rem; line-height: 1.3; color: var(--ink); }
    .section-card p, .section-card li { color: var(--muted); line-height: 1.65; margin: 0; }
    .section-card ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0; }
    .section-card li + li { margin-top: 0.5rem; }
    .section-card strong { color: var(--ink); }
    .note-card p { margin: 0; }
    .note-card p + p { margin-top: 0.75rem; }

    /* Links wear the app's accent, not the Cold Call X site's blue. */
    body.crmx .section-card a, .note-card a { color: var(--accent); text-decoration: none; }
    body.crmx .section-card a:hover, .note-card a:hover { text-decoration: underline; }
  </style>

  <!-- Structured data -->
  <script type="application/ld+json">

<body class="crmx antialiased">

  <div class="page">

        <a href="/" class="back-link">← Cold Call X</a>
