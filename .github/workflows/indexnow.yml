name: IndexNow ping

# Pushes recently changed sitemap URLs (by <lastmod>) to IndexNow (api.indexnow.org), which
# distributes it to Bing, Seznam, Yandex, Naver and other participating
# engines. Bing's index feeds DuckDuckGo, Yahoo, Ecosia, ChatGPT Search and
# Copilot, so this accelerates discovery on engines that accept push
# notifications without requiring any Webmaster account or stored secret.
#
# The IndexNow key is NOT a secret: it is a public proof-of-site-control
# token, hosted at https://coldcallx.app/<key>.txt (file lives in the
# repository root).

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every sitemap URL, not only recently changed ones"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # For the post-deploy trigger, only run when the deploy actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          KEY: "b4817af99c8647949106f79c01ac3aee"
          ALL: ${{ github.event.inputs.all }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from urllib.error import HTTPError

          key = os.environ["KEY"]
          host = "coldcallx.app"
          xml = urllib.request.urlopen(
              f"https://{host}/sitemap.xml", timeout=30
          ).read().decode()
          entries = re.findall(r"<loc>(.*?)</loc>\s*<lastmod>(.*?)</lastmod>", xml)
          if not entries:
              raise SystemExit("no URLs found in live sitemap")
          # IndexNow is for changed URLs. Re-submitting the whole sitemap on
          # every deploy tells engines nothing and can get the host's pings
          # discounted, so only send pages whose sitemap lastmod is from the
          # last 2 days (UTC), unless a manual run asks for all of them.
          from datetime import date, timedelta
          cutoff = (date.today() - timedelta(days=2)).isoformat()
          if os.environ.get("ALL") == "true":
              urls = [u for u, _ in entries]
          else:
              urls = [u for u, m in entries if m[:10] >= cutoff]
          if not urls:
              print(f"No sitemap URLs with lastmod >= {cutoff}; nothing to submit")
              raise SystemExit(0)
          print("Submitting:", *urls, sep="\n  ")
          payload = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print("IndexNow status:", r.status)
          except HTTPError as e:
              print("IndexNow status:", e.code, e.read(200).decode(errors="replace"))
              raise SystemExit(f"IndexNow submission failed: {e.code}")
          print(f"Submitted {len(urls)} URLs to IndexNow")
          PY
